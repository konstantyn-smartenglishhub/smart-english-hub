                            contextHtml: "<div class='space-y-3'><p class='font-bold text-indigo-950 text-base'>What Affects Our Personality?</p><p><strong>(1)</strong> In his book about the family's influence on a personality, the British psychologist Tom Hughes tells that our position in the family is the strongest factor that influences our personality.</p><p><strong>(2)</strong> In his opinion, the oldest children get maximum attention from their parents, and the result is that they're usually quite self-confident people. They make good leaders. For example, the famous Prime Minister Winston Churchill was a firstborn child. The oldest children are often ambitious. They're more likely to go to university than their brothers or sisters. They often get the top jobs, too. They are also responsible people, because they often have to look after their younger brothers or sisters. The downside of this is that sometimes this means that when they're older they worry a lot about things. They can also be quite bossy and even aggressive, especially when they don't get what they want.</p><p><strong>(3)</strong> The middle children are usually independent and competitive. It's because they have to fight with their brothers and sisters for their parents' attention. And they're usually sociable; they like being with people, probably because they have always had other children to play with. However, on the negative side, the middle children are often jealous of their brothers and sisters and they can be moody.</p><p><strong>(4)</strong> If a child is the youngest in the family, he or she will probably be very charming, affectionate and quite relaxed. On the other hand, the youngest children are often quite lazy. This is because they always have their older brothers and sisters to help them. And they can be quite manipulative — they use their charm to get what they want.</p><p><strong>(5)</strong> The only children in the family don't have to share with anyone — so they're often spoilt by their parents and their grandparents. As a result, they can be quite selfish. They think of themselves more than of other people. On the positive side, the only children are usually very organised and responsible, and they can be very imaginative, too.</p></div>",

        // =========================================================================
        function isBuiltInQuiz(test) {
            return Boolean(
                test.isStudyGuide ||
                (test.questions && test.questions.length > 0) ||
                (test.sections && test.sections.length > 0)
            );
        }

        function normalizeTextAnswer(str) {
            return String(str || "")
                .toLowerCase()
                .replace(/[’‘`]/g, "'")
                .replace(/[.!?,;:]+$/g, "")
                .replace(/\s+/g, " ")
                .trim();
        }

        function isTextAnswerCorrect(userInput, acceptedAnswers) {
            const normUser = normalizeTextAnswer(userInput);
            if (!normUser) return false;
            const list = Array.isArray(acceptedAnswers) ? acceptedAnswers : [acceptedAnswers];
            return list.some(ans => normalizeTextAnswer(ans) === normUser);
        }

        function shuffleOptionsForQuestion(q) {
            if (!q.options || q.options.length <= 2 || q.type === "tf" || q.noShuffle) {
                return {
                    ...q,
                    _displayOptions: (q.options || []).map((opt, idx) => ({ text: opt, origIdx: idx }))
                };
            }
            const indexed = q.options.map((opt, idx) => ({ text: opt, origIdx: idx }));
            for (let i = indexed.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                const tmp = indexed[i];
                indexed[i] = indexed[j];
                indexed[j] = tmp;
            }
            return { ...q, _displayOptions: indexed };
        }

        function logToGoogleSheet(studentClass, studentName, action, score, details) {
            if (!GOOGLE_SCRIPT_URL) return;
            const payload = JSON.stringify({
                studentClass: studentClass,
                studentName: studentName,
                action: action,
                score: score !== undefined && score !== null ? score : "—",
                details: details || "—"
            });
            try {
                fetch(GOOGLE_SCRIPT_URL, {
                    method: "POST",
                    mode: "no-cors",
                    keepalive: true,
                    headers: { "Content-Type": "text/plain" },
                    body: payload
                }).catch(() => {
                    if (navigator.sendBeacon) navigator.sendBeacon(GOOGLE_SCRIPT_URL, payload);
                });
            } catch (e) {
                if (navigator.sendBeacon) {
                    try { navigator.sendBeacon(GOOGLE_SCRIPT_URL, payload); } catch (err) {}
                }
            }
        }

        function copyToClipboard(text) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).catch(() => {});
            }
            try {
                const ta = document.createElement("textarea");
                ta.value = text;
                ta.style.position = "fixed";
                ta.style.opacity = "0";
                document.body.appendChild(ta);
                ta.select();
                document.execCommand("copy");
                document.body.removeChild(ta);
            } catch (e) {}
        }

        function buildShareUrl(category, subFilter, testId) {
            const base = window.location.origin + window.location.pathname;
            if (testId === "cefr-test") return `${base}#cefr-test`;
            if (testId) return `${base}#test-${testId}`;
            if (subFilter && subFilter !== "All") return `${base}#${encodeURIComponent(category)}/${encodeURIComponent(subFilter)}`;
            return `${base}#${encodeURIComponent(category)}`;
        }

        const ALL_ITEMS = MENU_GROUPS.reduce((acc, g) => acc.concat(g.items), []);

        function findCategoryConfig(catName) {
            return ALL_ITEMS.find(item => item.id.toLowerCase() === (catName || "").toLowerCase()) || null;
        }

        function findTestById(testsMap, targetId) {
            if (String(targetId).toLowerCase() === "cefr-test") {
                return { category: "Home", test: CEFR_PLACEMENT_TEST };
            }
            for (const cat of Object.keys(testsMap)) {
                const found = (testsMap[cat] || []).find(t => String(t.id) === String(targetId));
                if (found) return { category: cat, test: found };
            }
            return null;
        }

        function parseHashRoute(testsMap) {
            const rawHash = decodeURIComponent((window.location.hash || "").replace(/^#/, "")).trim();
            if (!rawHash) return { tab: "Home", subFilter: "All", test: null };

            if (rawHash.toLowerCase() === "cefr-test") {
                return { tab: "Home", subFilter: "All", test: CEFR_PLACEMENT_TEST };
            }

            if (rawHash.toLowerCase().startsWith("test-")) {
                const id = rawHash.slice(5);
                const match = findTestById(testsMap, id);
                if (match) {
                    return {
                        tab: match.category,
                        subFilter: match.test.level || "All",
                        test: match.test
                    };
                }
            }

            const parts = rawHash.split("/");
            const catConfig = findCategoryConfig(parts[0]);
            if (catConfig) {
                let subFilter = "All";
                if (catConfig.hasLevels && parts[1]) {
                    const matchedLevel = LISTENING_LEVELS.find(l => l.toLowerCase() === parts[1].toLowerCase());
                    if (matchedLevel) subFilter = matchedLevel;
                }
                return { tab: catConfig.id, subFilter: subFilter, test: null };
            }

            return { tab: "Home", subFilter: "All", test: null };
        }

        function EmbeddedQuizModal({ test, category, onClose }) {

            const [copied, setCopied] = useState(false);

                const normalizedSections = test.sections && test.sections.length > 0

                    ...sec,

                        const key = globalIndex++;
                        const qType = q.type || (q.acceptedAnswers ? "text" : "mc");
                        const shuffled = (test.isStudyGuide || !q.options)
    ? { ...q, type: qType }

                        return {
                            ...shuffled,
                            _key: key,
                            _displayNum: q.num || (key + 1)

                }));

                };
                window.addEventListener("beforeunload", handleBeforeUnload);
                return () => window.removeEventListener("beforeunload", handleBeforeUnload);

                onClose();

                setCopied(true);
                setTimeout(() => setCopied(false), 3000);

            const evaluateQuestion = (q, userAns) => {
                if (q.type === "text" || q.type === "writing") {
                    return isTextAnswerCorrect(userAns, q.acceptedAnswers);
                }
                return userAns === q.correct;
            };

                let correctCount = 0;
                let weightedSum = 0;
                let totalWeight = 0;
                let hasCustomWeights = false;

                allFlatQuestions.forEach(q => {
                    const w = typeof q.weight === "number" ? q.weight : 1;
                    if (typeof q.weight === "number") hasCustomWeights = true;
                    totalWeight += w;
                    if (evaluateQuestion(q, answers[q._key])) {
                        correctCount++;
                        weightedSum += w;
                    }
                });

                let finalGrade = 0;
                if (hasCustomWeights) {
                    const capped = Math.min(maxGrade, weightedSum);
                    finalGrade = Math.round(capped);
                } else {
                    finalGrade = totalWeight === 0 ? 0 : Math.round((weightedSum / totalWeight) * maxGrade);

                            student.studentName,
                            test.title,
                            res.finalGrade,

                                h("input", {

                                    onChange: (e) => setLoginName(e.target.value),

                                })
                            ),
                            h("div", { className: "pt-2 flex gap-3" },
                                h("button", { type: "button", onClick: onClose, className: "flex-1 py-3 px-4 rounded-xl font-semibold text-slate-700 bg-slate-100 hover:bg-slate-200 transition" }, "Скасувати"),
                                h("button", {

                                }, "Почати тест")
                            )

                h("div", { className: "bg-white rounded-3xl w-full max-w-4xl shadow-2xl overflow-hidden flex flex-col max-h-[92vh]" },
                    h("div", { className: "bg-gradient-to-r from-indigo-600 to-purple-600 p-5 sm:p-6 flex justify-between items-center text-white shrink-0" },
                        h("div", { className: "flex items-center gap-3" },
                            h("div", { className: "hidden sm:block" }, h(BrandLogoMark, { size: 42 })),
                            h("div", null,
                                h("div", { className: "flex flex-wrap items-center gap-2" },

                                    h("span", { className: "text-xs bg-amber-400 text-slate-900 px-2.5 py-0.5 rounded-full font-bold" }, `${student.studentName} • Клас: ${student.studentClass}`),
                                    !submitted && h("button", {

        function App() {
            const initialRoute = parseHashRoute(TESTS_DATABASE);
            const [activeTab, setActiveTab] = useState(initialRoute.tab);
            const [activeSubFilter, setActiveSubFilter] = useState(initialRoute.subFilter);
            const [activeTest, setActiveTest] = useState(initialRoute.test);
            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);

            useEffect(() => {
                const onHashChange = () => {
                    const route = parseHashRoute(TESTS_DATABASE);
                    setActiveTab(route.tab);
                    setActiveSubFilter(route.subFilter);
                    setActiveTest(route.test);
                };
                window.addEventListener("hashchange", onHashChange);
                return () => window.removeEventListener("hashchange", onHashChange);
            }, []);

            const selectTab = (tabId) => {
                setActiveTab(tabId);
                setActiveSubFilter("All");
                setActiveTest(null);
                setIsMobileMenuOpen(false);
                window.location.hash = tabId === "Home" ? "" : encodeURIComponent(tabId);
            };

            const selectSubFilter = (filterName) => {
                setActiveSubFilter(filterName);
                setActiveTest(null);
                window.location.hash = filterName === "All"
                    ? encodeURIComponent(activeTab)
                    : `${encodeURIComponent(activeTab)}/${encodeURIComponent(filterName)}`;
            };

            const openCefrTest = () => {
                setActiveTest(CEFR_PLACEMENT_TEST);
                window.location.hash = "cefr-test";
            };

            const openTest = (test) => {
                setActiveTest(test);
                window.location.hash = test.id === "cefr-test" ? "cefr-test" : `test-${test.id}`;
            };

            const closeTest = () => {
                setActiveTest(null);
                if (activeTab === "Home") {
                    window.location.hash = "";
                } else {
                    window.location.hash = activeSubFilter !== "All"
                        ? `${encodeURIComponent(activeTab)}/${encodeURIComponent(activeSubFilter)}`
                        : encodeURIComponent(activeTab);
                }
            };

            const currentCategoryConfig = findCategoryConfig(activeTab);

            return h("div", { className: "flex h-screen bg-slate-50 overflow-hidden" },
                isMobileMenuOpen && h("div", {
                    className: "fixed inset-0 bg-black/50 z-40 md:hidden",
                    onClick: () => setIsMobileMenuOpen(false)
                }),

                h("aside", {
                    className: `fixed md:static inset-y-0 left-0 z-50 w-72 bg-white border-r border-slate-200 transform transition-transform duration-300 ease-in-out flex flex-col ${
                        isMobileMenuOpen ? "translate-x-0" : "-translate-x-full md:translate-x-0"
                    }`
                },
                    h("div", {
                        onClick: () => selectTab("Home"),
                        className: "p-6 border-b border-slate-100 flex items-center justify-between cursor-pointer"
                    },
                        h("div", { className: "flex items-center gap-3" },
                            h(BrandLogoMark, { size: 40 }),
                            h("h1", { className: "text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-600 to-purple-600" }, "Smart English Hub")
                        ),
                        h("button", { className: "md:hidden text-slate-500", onClick: (e) => { e.stopPropagation(); setIsMobileMenuOpen(false); } },
                            h(SvgIcon, { name: "x", size: 24 })
                        )
                    ),
                    h("div", { className: "flex-1 overflow-y-auto p-4 custom-scrollbar" },
                        MENU_GROUPS.map((group, idx) => h("div", { key: idx, className: "mb-6" },
                            h("h2", { className: "text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 px-3" }, group.title),
                            h("ul", { className: "space-y-1" },
                                group.items.map(item => {
                                    const isActive = activeTab === item.id;
                                    return h("li", { key: item.id },
                                        h("button", {
                                            onClick: () => selectTab(item.id),
                                            className: `w-full flex items-center gap-3 px-3 py-2.5 rounded-xl transition-all duration-200 text-sm font-medium ${
                                                isActive ? "bg-indigo-50 text-indigo-700 shadow-sm" : "text-slate-600 hover:bg-slate-100 hover:text-slate-900"
                                            }`
                                        },
                                            h(SvgIcon, { name: item.icon || "book", size: 18, className: isActive ? "text-indigo-600" : "text-slate-400" }),
                                            item.label
                                        )
                                    );
                                })
                            )
                        ))
                    )
                ),

                h("main", { className: "flex-1 flex flex-col h-full overflow-hidden relative" },
                    h("header", { className: "md:hidden flex items-center justify-between p-4 bg-white border-b border-slate-200" },
                        h("div", { className: "flex items-center" },
                            h("button", { onClick: () => setIsMobileMenuOpen(true), className: "p-2 -ml-2 text-slate-600" }, h(SvgIcon, { name: "menu", size: 24 })),
                            h("span", { className: "font-bold text-slate-800 ml-2" }, activeTab)
                        ),
                        h("div", { onClick: () => selectTab("Home"), className: "flex items-center gap-2 cursor-pointer" },
                            h(BrandLogoMark, { size: 28 }),
                            h("span", { className: "text-xs font-bold text-indigo-600" }, "Smart English Hub")
                        )
                    ),
                    h("div", { className: "flex-1 overflow-y-auto p-6 md:p-10" },
                        activeTab === "Home" || !currentCategoryConfig
                            ? h(HomeView, { setActiveTab: selectTab, onOpenCefrTest: openCefrTest })
                            : h(CategoryView, {
                                categoryConfig: currentCategoryConfig,
                                activeSubFilter: activeSubFilter,
                                onSelectSubFilter: selectSubFilter,
                                tests: TESTS_DATABASE[activeTab] || [],
                                onOpenTest: openTest
                            })
                    )
                ),

                activeTest && (
                    isBuiltInQuiz(activeTest)
                        ? h(EmbeddedQuizModal, { test: activeTest, category: activeTab, onClose: closeTest })
                        : h(ExternalTestModal, { test: activeTest, category: activeTab, onClose: closeTest })
                )
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(h(App));
    })();
    </script>
</body>
</html>
