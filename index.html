                { level: "A1", question: "My brother ________ to school by bus every morning.", options: ["go", "going", "goes", "is go"], correct: 2 },
                { level: "A1", question: "Excuse me, what ________ is it? — It's half past three.", options: ["hour", "clock", "watch", "time"], correct: 3 },

                { level: "B1", question: "The new bridge ________ by a famous architect next year.", options: ["will build", "is building", "will be built", "built"], correct: 2 },
                { level: "B1", question: "She decided to ________ up yoga to reduce stress after work.", options: ["make", "take", "put", "get"], correct: 1 },

                { level: "B2", question: "By the time we arrived at the theatre, the play ________.", options: ["already started", "had already started", "has already started", "was already starting"], correct: 1 },
                { level: "B2", question: "Despite ________ very tired, he stayed up late to finish the report.", options: ["he was", "of being", "being", "to be"], correct: 2 },
                { level: "B2", question: "I'd rather you ________ anyone about our plans just yet.", options: ["don't tell", "didn't tell", "not to tell", "haven't told"], correct: 1 },

                { level: "C1", question: "It is high time the government ________ decisive action on climate change.", options: ["takes", "will take", "took", "has taken"], correct: 2 },

                { level: "C1", question: "________ had we boarded the plane than the captain announced a technical delay.", options: ["Hardly", "No sooner", "Scarcely", "Rarely"], correct: 1 },
                { level: "C1", question: "Her remarks were completely ________ to the topic under discussion.", options: ["irrelevant", "irreversible", "irreplaceable", "irresistible"], correct: 0 }

        };

        function evaluateCefrScore(score) {
            if (score <= 6) {
                return {
                    cefr: "A1 (Beginner)",
                    badgeColor: "bg-sky-100 text-sky-800 border-sky-200",
                    summary: "Ви володієте базовими фразами, простими часами (Present Simple) та повсякденною лексикою.",
                    recommendation: "Рекомендовані розділи: Full Blast 5 — Full Blast 6"
                };
            }
            if (score <= 12) {
                return {
                    cefr: "A2 (Elementary)",
                    badgeColor: "bg-teal-100 text-teal-800 border-teal-200",
                    summary: "Ви впевнено спілкуєтеся на знайомі теми, знаєте Past Simple, ступені порівняння та базові фразові дієслова.",
                    recommendation: "Рекомендовані розділи: Full Blast 7 — Full Blast 8"
                };
            }
            if (score <= 18) {
                return {
                    cefr: "B1 (Intermediate)",
                    badgeColor: "bg-indigo-100 text-indigo-800 border-indigo-200",
                    summary: "Хороший середній рівень! Ви орієнтуєтеся у Present Perfect, пасивному стані та умовних реченнях 1-го типу.",
                    recommendation: "Рекомендовані розділи: Full Blast 9 — Full Blast 11, Karpiuk 10"
                };
            }
            if (score <= 22) {
                return {
                    cefr: "B2 (Upper-Intermediate)",
                    badgeColor: "bg-purple-100 text-purple-800 border-purple-200",
                    summary: "Високий рівень володіння граматикою та лексикою, достатній для успішного складання НМТ та міжнародних іспитів.",
                    recommendation: "Рекомендовані розділи: Oxford Exam Trainer B2, Get 200(2)"
                };
            }
            return {
                cefr: "C1 (Advanced)",
                badgeColor: "bg-amber-100 text-amber-900 border-amber-300",
                summary: "Вільне володіння складною граматикою (інверсія, умовні конструкції) та академічною лексикою.",
                recommendation: "Рекомендовані розділи: Oxford Exam Trainer B2, Get 200(2) (поглиблений рівень)"

        // =========================================================================
        // 4. БАЗА ТЕСТІВ ТА МАТЕРІАЛІВ (ОНОВЛЕНІ ПОСИЛАННЯ НА НОВИЙ GOOGLE ДИСК)

        const TESTS_DATABASE = {

            "Full Blast 9": [],

        // =========================================================================
        // 5. ДОПОМІЖНІ ФУНКЦІЇ
        // =========================================================================
        function isBuiltInQuiz(test) {
            return Boolean(
                (test.questions && test.questions.length > 0) ||
                (test.sections && test.sections.length > 0)
            );
        }

        function logToGoogleSheet(studentClass, studentName, action, score) {
            if (!GOOGLE_SCRIPT_URL) return;
            const payload = JSON.stringify({
                studentClass: studentClass,
                studentName: studentName,
                action: action,
                score: score || "—"
            });
            try {
                fetch(GOOGLE_SCRIPT_URL, {
                    method: "POST",
                    mode: "no-cors",
                    keepalive: true,
                    headers: { "Content-Type": "text/plain" },
                    body: payload
                }).catch(() => {
                    if (navigator.sendBeacon) navigator.sendBeacon(GOOGLE_SCRIPT_URL, payload);
                });
            } catch (e) {
                if (navigator.sendBeacon) {
                    try { navigator.sendBeacon(GOOGLE_SCRIPT_URL, payload); } catch (err) {}
                }
            }
        }

        function copyToClipboard(text) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).catch(() => {});
            }
            try {
                const ta = document.createElement("textarea");
                ta.value = text;
                ta.style.position = "fixed";
                ta.style.opacity = "0";
                document.body.appendChild(ta);
                ta.select();
                document.execCommand("copy");
                document.body.removeChild(ta);
            } catch (e) {}
        }

        function buildShareUrl(category, subFilter, testId) {
            const base = window.location.origin + window.location.pathname;
            if (testId === "cefr-test") return `${base}#cefr-test`;
            if (testId) return `${base}#test-${testId}`;
            if (subFilter && subFilter !== "All") return `${base}#${encodeURIComponent(category)}/${encodeURIComponent(subFilter)}`;
            return `${base}#${encodeURIComponent(category)}`;
        }

        const ALL_ITEMS = MENU_GROUPS.reduce((acc, g) => acc.concat(g.items), []);

        function findCategoryConfig(catName) {
            return ALL_ITEMS.find(item => item.id.toLowerCase() === (catName || "").toLowerCase()) || null;
        }

        function findTestById(testsMap, targetId) {
            if (String(targetId).toLowerCase() === "cefr-test") {
                return { category: "Home", test: CEFR_PLACEMENT_TEST };
            }
            for (const cat of Object.keys(testsMap)) {
                const found = (testsMap[cat] || []).find(t => String(t.id) === String(targetId));
                if (found) return { category: cat, test: found };
            }
            return null;
        }

        function parseHashRoute(testsMap) {
            const rawHash = decodeURIComponent((window.location.hash || "").replace(/^#/, "")).trim();
            if (!rawHash) return { tab: "Home", subFilter: "All", test: null };

            if (rawHash.toLowerCase() === "cefr-test") {
                return { tab: "Home", subFilter: "All", test: CEFR_PLACEMENT_TEST };
            }

            if (rawHash.toLowerCase().startsWith("test-")) {
                const id = rawHash.slice(5);
                const match = findTestById(testsMap, id);
                if (match) {
                    return {
                        tab: match.category,
                        subFilter: match.test.unit || match.test.level || "All",
                        test: match.test
                    };
                }
            }

            const parts = rawHash.split("/");
            const catConfig = findCategoryConfig(parts[0]);
            if (catConfig) {
                let subFilter = "All";
                if (catConfig.hasUnits && parts[1]) {
                    const matchedUnit = UNIT_LIST.find(u => u.toLowerCase() === parts[1].toLowerCase());
                    if (matchedUnit) subFilter = matchedUnit;
                } else if (catConfig.hasLevels && parts[1]) {
                    const matchedLevel = LISTENING_LEVELS.find(l => l.toLowerCase() === parts[1].toLowerCase());
                    if (matchedLevel) subFilter = matchedLevel;
                }
                return { tab: catConfig.id, subFilter: subFilter, test: null };
            }

            return { tab: "Home", subFilter: "All", test: null };
        }

        // =========================================================================
        // 7. ВБУДОВАНИЙ ПЛЕЄР ТЕСТІВ (ВКЛЮЧНО З CEFR PLACEMENT TEST)
        // =========================================================================
        function EmbeddedQuizModal({ test, category, onClose }) {
            const getSavedStudent = () => {
                try {

                                    ? "Open the Google Drive archive (contains all Unit 1 — Unit 12 folders) or select an interactive test below"
                                    : hasLevels
                                        ? "Open the Google Drive listening archive or filter interactive tracks by CEFR level"
                                        : "Select a test or resource folder below"
                            )
                        ),
                        h("button", {
                            type: "button",
                            onClick: handleCopyPageLink,
                            className: "px-4 py-2.5 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-semibold rounded-xl transition flex items-center gap-2 self-start sm:self-auto cursor-pointer"
                        }, h(SvgIcon, { name: "share", size: 18 }), copiedPage ? "Посилання скопійовано!" : "Copy Page Link")
                    ),

                    // Панель Unit 1 - Unit 12 для Exam Preparation
                    hasUnits && h("div", { className: "pt-2 border-t border-slate-100" },
                        h("div", { className: "text-xs font-bold text-slate-400 uppercase tracking-wider mb-2.5" }, "Units Navigation (Unit 1 — Unit 12):"),
                        h("div", { className: "flex flex-wrap gap-2" },
                            ["All", ...UNIT_LIST].map(unitName => {
                                const isSelected = activeSubFilter === unitName;
                                return h("button", {
                                    key: unitName,
                                    type: "button",
                                    onClick: () => onSelectSubFilter(unitName),
                                    className: `px-3.5 py-1.5 rounded-xl text-sm font-semibold transition cursor-pointer ${
                                        isSelected
                                            ? "bg-indigo-600 text-white shadow-sm"
                                            : "bg-slate-100 text-slate-600 hover:bg-slate-200 hover:text-slate-900"
                                    }`
                                }, unitName === "All" ? "All Units" : unitName);
                            })
                        )
                    ),

                    // Панель фільтрів CEFR + пошук для Listening Practice
                    hasLevels && h("div", { className: "pt-3 border-t border-slate-100 flex flex-col md:flex-row md:items-center justify-between gap-4" },
                        h("div", { className: "flex flex-wrap gap-2" },
                            LISTENING_LEVELS.map(lvl => {
                                const isSelected = activeSubFilter === lvl;
                                return h("button", {
                                    key: lvl,
                                    type: "button",
                                    onClick: () => onSelectSubFilter(lvl),
                                    className: `px-3.5 py-1.5 rounded-xl text-sm font-semibold transition cursor-pointer ${
                                        isSelected
                                            ? "bg-indigo-600 text-white shadow-sm"
                                            : "bg-slate-100 text-slate-600 hover:bg-slate-200 hover:text-slate-900"
                                    }`
                                }, lvl === "All" ? "All Levels" : lvl);
                            })
                        ),
                        h("div", { className: "relative w-full md:w-64" },
                            h("div", { className: "absolute inset-y-0 left-3 flex items-center pointer-events-none text-slate-400" },
                                h(SvgIcon, { name: "search", size: 16 })
                            ),
                            h("input", {
                                type: "text",
                                value: searchQuery,
                                onChange: (e) => setSearchQuery(e.target.value),
                                placeholder: "Пошук аудіювання...",
                                className: "w-full pl-9 pr-3 py-2 text-sm rounded-xl border border-slate-200 bg-slate-50 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                            })
                        )
                    )
                ),

                filteredTests.length === 0
                    ? h("div", { className: "text-center py-16 bg-white rounded-2xl border border-dashed border-slate-200 space-y-2" },
                        h("p", { className: "text-slate-600 font-semibold" },
                            hasUnits && activeSubFilter !== "All"
                                ? `${category} — ${activeSubFilter}: інтерактивний онлайн-тест готується (усі файли юніта доступні у вкладці All Units)`
                                : "У цьому розділі поки немає доданих тестів або матеріалів."
                        ),
                        hasUnits && activeSubFilter !== "All" && h("button", {
                            type: "button",
                            onClick: () => onSelectSubFilter("All"),
                            className: "mt-2 px-4 py-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-semibold rounded-xl text-sm transition cursor-pointer"
                        }, "Перейти до All Units (Google Drive)")
                    )
                    : h("div", { className: "grid md:grid-cols-2 lg:grid-cols-3 gap-6" },
                        filteredTests.map(test => {
                            const builtIn = isBuiltInQuiz(test);
                            const badgeText = (test.unit && test.unit !== "All") ? test.unit : (test.level && test.level !== "All" ? test.level : null);
                            return h("div", { key: test.id, className: "bg-white p-6 rounded-2xl border border-slate-100 shadow-sm hover:shadow-md transition flex flex-col justify-between" },
                                h("div", { className: "space-y-2.5 mb-6" },
                                    h("div", { className: "flex items-start justify-between gap-2" },
                                        h("div", null,
                                            badgeText && h("span", { className: "inline-block text-xs font-bold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-md mb-1.5" }, badgeText),
                                            h("h3", { className: "font-bold text-lg text-slate-800 leading-snug" }, test.title)
                                        ),
                                        h("button", {
                                            type: "button",
                                            title: "Скопіювати пряме посилання на цей матеріал",
                                            onClick: () => handleCopyTestLink(test),
                                            className: "p-2 rounded-lg bg-slate-50 hover:bg-indigo-50 text-slate-500 hover:text-indigo-600 transition shrink-0 flex items-center gap-1 text-xs font-semibold cursor-pointer"
                                        },
                                            h(SvgIcon, { name: "share", size: 15 }),
                                            copiedTestId === test.id ? "OK!" : ""
                                        )
                                    ),
                                    h("p", { className: "text-slate-500 text-sm leading-relaxed" }, test.description)
                                ),
                                h("button", {
                                    type: "button",
                                    onClick: () => onOpenTest(test),
                                    className: `w-full py-2.5 px-4 font-semibold rounded-xl transition flex items-center justify-center gap-2 shadow-sm cursor-pointer ${
                                        builtIn
                                            ? "bg-indigo-600 hover:bg-indigo-700 text-white"
                                            : "bg-indigo-50 hover:bg-indigo-600 text-indigo-700 hover:text-white"
                                    }`
                                }, h(SvgIcon, { name: builtIn ? "play" : "external", size: 16 }), builtIn ? "Start Test" : "Open Folder")
                            );
                        })
                    )
            );
        }

        // =========================================================================
        // 8. ГОЛОВНИЙ ДОДАТОК
        // =========================================================================
        function App() {
            const initialRoute = parseHashRoute(TESTS_DATABASE);
            const [activeTab, setActiveTab] = useState(initialRoute.tab);
            const [activeSubFilter, setActiveSubFilter] = useState(initialRoute.subFilter);
            const [activeTest, setActiveTest] = useState(initialRoute.test);
            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);

            useEffect(() => {
                const onHashChange = () => {
                    const route = parseHashRoute(TESTS_DATABASE);
                    setActiveTab(route.tab);
                    setActiveSubFilter(route.subFilter);
                    setActiveTest(route.test);
                };
                window.addEventListener("hashchange", onHashChange);
                return () => window.removeEventListener("hashchange", onHashChange);
            }, []);

            useEffect(() => {
                try {
                    if (!sessionStorage.getItem("english_hub_guest_logged")) {
                        let visitorInfo = "Відвідувач сайту";
                        const saved = localStorage.getItem("english_hub_student");
                        if (saved) {
                            const parsed = JSON.parse(saved);
                            if (parsed && parsed.studentName) visitorInfo = `${parsed.studentName} (${parsed.studentClass})`;
                        }
                        logToGoogleSheet("GUEST", visitorInfo, `Вхід (${activeTab})`, "—");
                        sessionStorage.setItem("english_hub_guest_logged", "true");
                    }
                } catch (e) {}
            }, []);

            const selectTab = (tabId) => {
                setActiveTab(tabId);
                setActiveSubFilter("All");
                setActiveTest(null);
                setIsMobileMenuOpen(false);
                window.location.hash = tabId === "Home" ? "" : encodeURIComponent(tabId);
            };

            const selectSubFilter = (filterName) => {
                setActiveSubFilter(filterName);
                setActiveTest(null);
                window.location.hash = filterName === "All"
                    ? encodeURIComponent(activeTab)
                    : `${encodeURIComponent(activeTab)}/${encodeURIComponent(filterName)}`;
            };

            const openCefrTest = () => {
                setActiveTest(CEFR_PLACEMENT_TEST);
                window.location.hash = "cefr-test";
            };

            const openTest = (test) => {
                setActiveTest(test);
                window.location.hash = test.id === "cefr-test" ? "cefr-test" : `test-${test.id}`;
            };

            const closeTest = () => {
                setActiveTest(null);
                if (activeTab === "Home") {
                    window.location.hash = "";
                } else {
                    window.location.hash = activeSubFilter !== "All"
                        ? `${encodeURIComponent(activeTab)}/${encodeURIComponent(activeSubFilter)}`
                        : encodeURIComponent(activeTab);
                }
            };

            const currentCategoryConfig = findCategoryConfig(activeTab);

            return h("div", { className: "flex h-screen bg-slate-50 overflow-hidden" },
                isMobileMenuOpen && h("div", {
                    className: "fixed inset-0 bg-black/50 z-40 md:hidden",
                    onClick: () => setIsMobileMenuOpen(false)
                }),

                // Бокове меню з однаковим логотипом та фавіконом (Варіант 2)
                h("aside", {
                    className: `fixed md:static inset-y-0 left-0 z-50 w-72 bg-white border-r border-slate-200 transform transition-transform duration-300 ease-in-out flex flex-col ${
                        isMobileMenuOpen ? "translate-x-0" : "-translate-x-full md:translate-x-0"
                    }`
                },
                    h("div", {
                        onClick: () => selectTab("Home"),
                        className: "p-6 border-b border-slate-100 flex items-center justify-between cursor-pointer"
                    },
                        h("div", { className: "flex items-center gap-3" },
                            h(BrandLogoMark, { size: 40 }),
                            h("h1", { className: "text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-600 to-purple-600" }, "Smart English Hub")
                        ),
                        h("button", { className: "md:hidden text-slate-500", onClick: (e) => { e.stopPropagation(); setIsMobileMenuOpen(false); } },
                            h(SvgIcon, { name: "x", size: 24 })
                        )
                    ),
                    h("div", { className: "flex-1 overflow-y-auto p-4 custom-scrollbar" },
                        MENU_GROUPS.map((group, idx) => h("div", { key: idx, className: "mb-6" },
                            h("h2", { className: "text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 px-3" }, group.title),
                            h("ul", { className: "space-y-1" },
                                group.items.map(item => {
                                    const isActive = activeTab === item.id;
                                    return h("li", { key: item.id },
                                        h("button", {
                                            onClick: () => selectTab(item.id),
                                            className: `w-full flex items-center gap-3 px-3 py-2.5 rounded-xl transition-all duration-200 text-sm font-medium ${
                                                isActive ? "bg-indigo-50 text-indigo-700 shadow-sm" : "text-slate-600 hover:bg-slate-100 hover:text-slate-900"
                                            }`
                                        },
                                            h(SvgIcon, { name: item.icon || "book", size: 18, className: isActive ? "text-indigo-600" : "text-slate-400" }),
                                            item.label
                                        )
                                    );
                                })
                            )
                        ))
                    )
                ),

                h("main", { className: "flex-1 flex flex-col h-full overflow-hidden relative" },
                    h("header", { className: "md:hidden flex items-center justify-between p-4 bg-white border-b border-slate-200" },
                        h("div", { className: "flex items-center" },
                            h("button", { onClick: () => setIsMobileMenuOpen(true), className: "p-2 -ml-2 text-slate-600" }, h(SvgIcon, { name: "menu", size: 24 })),
                            h("span", { className: "font-bold text-slate-800 ml-2" }, activeTab)
                        ),
                        h("div", { onClick: () => selectTab("Home"), className: "flex items-center gap-2 cursor-pointer" },
                            h(BrandLogoMark, { size: 28 }),
                            h("span", { className: "text-xs font-bold text-indigo-600" }, "Smart English Hub")
                        )
                    ),
                    h("div", { className: "flex-1 overflow-y-auto p-6 md:p-10" },
                        activeTab === "Home" || !currentCategoryConfig
                            ? h(HomeView, { setActiveTab: selectTab, onOpenCefrTest: openCefrTest })
                            : h(CategoryView, {
                                categoryConfig: currentCategoryConfig,
                                activeSubFilter: activeSubFilter,
                                onSelectSubFilter: selectSubFilter,
                                tests: TESTS_DATABASE[activeTab] || [],
                                onOpenTest: openTest
                            })
                    )
                ),

                activeTest && (
                    isBuiltInQuiz(activeTest)
                        ? h(EmbeddedQuizModal, { test: activeTest, category: activeTab, onClose: closeTest })
                        : h(ExternalTestModal, { test: activeTest, category: activeTab, onClose: closeTest })
                )
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(h(App));
    })();
    </script>
</body>
</html>
